# Fly.io deploy config for apps/admin-web. See api.fly.toml's header comment
# for the Terraform/flyctl split this assumes.

primary_region = "iad"

[build]
  dockerfile = "../../apps/admin-web/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3001"
  # See customer-web.fly.toml's comment — API_INTERNAL_URL is set per
  # environment via `flyctl secrets set`, not here.

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 100
    soft_limit = 80

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/login"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "rolling"
