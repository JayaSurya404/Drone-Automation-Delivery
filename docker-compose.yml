services:
  # 1. PostgreSQL with PostGIS Spatial Extensions
  postgres:
    image: postgis/postgis:16-3.4
    container_name: skynav-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skynav
      POSTGRES_USER: skynav
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skynav}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skynav -d skynav"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - skynav-network

  # 2. Redis (Pub/Sub & Realtime Telemetry Bus)
  redis:
    image: redis:7-alpine
    container_name: skynav-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - skynav-network

  # 3. Python Advisory AI & Computer Vision Microservice
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: skynav-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      AI_HOST: "0.0.0.0"
      AI_PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - skynav-network

  # 4. SkyNav Fastify Domain REST & Realtime API Server
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: skynav-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3001
      API_HOST: "0.0.0.0"
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://skynav:${POSTGRES_PASSWORD:-skynav}@postgres:5432/skynav
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-skynav-development-jwt-secret-key-32chars}
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      AI_SERVICE_URL: http://ai:8000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skynav-network

  # 5. Next.js Aviation Operations Frontend Application
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_MAP_PROVIDER: "osm"
        NEXT_PUBLIC_MAP_TILES_URL: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
        NEXT_PUBLIC_MAX_TRAIL_POINTS: "25"
        NEXT_PUBLIC_WS_URL: "ws://localhost:3001/api/v1/ws/telemetry"
    container_name: skynav-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:3001/api/v1/ws/telemetry}
      NEXT_PUBLIC_MAP_PROVIDER: "osm"
      NEXT_PUBLIC_MAP_TILES_URL: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      NEXT_PUBLIC_MAX_TRAIL_POINTS: "25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - skynav-network

  # 6. Telemetry Ingestion Worker (Out-of-Order Tracking & Fanout)
  telemetry-worker:
    build:
      context: .
      dockerfile: services/telemetry-worker/Dockerfile
    container_name: skynav-telemetry-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    networks:
      - skynav-network

  # 7. Notification Outbox Worker (Transactional Event Delivery)
  notification-worker:
    build:
      context: .
      dockerfile: services/notification-worker/Dockerfile
    container_name: skynav-notification-worker
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://skynav:${POSTGRES_PASSWORD:-skynav}@postgres:5432/skynav
    networks:
      - skynav-network

volumes:
  postgres_data:
    name: skynav_postgres_data
  redis_data:
    name: skynav_redis_data

networks:
  skynav-network:
    name: skynav_network
    driver: bridge
